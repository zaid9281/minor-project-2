<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SOET Portal</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#003399,#0055cc);
      height:100vh; display:flex; align-items:center;
      justify-content:center; text-align:center; color:white;
      padding:20px;
    }
    .icon { font-size:4rem; margin-bottom:20px; animation:float 2.5s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
    h1 { font-size:1.4rem; margin-bottom:10px; }
    p { font-size:0.9rem; opacity:0.85; max-width:320px; margin:0 auto 24px; line-height:1.6; }
    button {
      background:rgba(255,255,255,0.15); color:white;
      border:2px solid rgba(255,255,255,0.3); border-radius:12px;
      padding:12px 28px; font-weight:700; font-size:0.9rem;
      cursor:pointer; transition:all 0.2s;
    }
    button:hover { background:rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div>
    <div class="icon">&#128246;</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Check your network and try again to continue using the SOET Resource Portal.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
